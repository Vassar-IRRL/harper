# Dual-arm joint trajectory controllers for MoveIt / harper_control bringup.
#
# Sim2real contract:
#   - command: position (rad)
#   - state: position + velocity
#   - update_rate 100 Hz — match this in simulation backends
#   - open_loop_control false — interpolate from measured joint state

/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      left_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      right_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  joint_state_broadcaster:
    ros__parameters: {}

  left_arm_controller:
    ros__parameters:
      joints:
        - left_shd_fex_joint
        - left_shd_aad_joint
        - left_shd_rot_joint
        - left_elb_fex_joint
        - left_fam_rot_joint
        - left_wrs_fex_joint
        - left_thb_mip_joint
        - left_ind_mip_joint
        - left_mid_mip_joint
        - left_rng_mip_joint
        - left_pnk_mip_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      allow_partial_joints_goal: true
      open_loop_control: false
      constraints:
        goal_time: 0.5
        stopped_velocity_tolerance: 0.05
        left_shd_fex_joint: {trajectory: 0.2, goal: 0.05}
        left_shd_aad_joint: {trajectory: 0.2, goal: 0.05}
        left_shd_rot_joint: {trajectory: 0.2, goal: 0.05}
        left_elb_fex_joint: {trajectory: 0.2, goal: 0.05}
        left_fam_rot_joint: {trajectory: 0.2, goal: 0.05}
        left_wrs_fex_joint: {trajectory: 0.2, goal: 0.05}
        left_thb_mip_joint: {trajectory: 0.3, goal: 0.08}
        left_ind_mip_joint: {trajectory: 0.3, goal: 0.08}
        left_mid_mip_joint: {trajectory: 0.3, goal: 0.08}
        left_rng_mip_joint: {trajectory: 0.3, goal: 0.08}
        left_pnk_mip_joint: {trajectory: 0.3, goal: 0.08}

  right_arm_controller:
    ros__parameters:
      joints:
        - right_shd_fex_joint
        - right_shd_aad_joint
        - right_shd_rot_joint
        - right_elb_fex_joint
        - right_fam_rot_joint
        - right_wrs_fex_joint
        - right_thb_mip_joint
        - right_ind_mip_joint
        - right_mid_mip_joint
        - right_rng_mip_joint
        - right_pnk_mip_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      allow_partial_joints_goal: true
      open_loop_control: false
      constraints:
        goal_time: 0.5
        stopped_velocity_tolerance: 0.05
        right_shd_fex_joint: {trajectory: 0.2, goal: 0.05}
        right_shd_aad_joint: {trajectory: 0.2, goal: 0.05}
        right_shd_rot_joint: {trajectory: 0.2, goal: 0.05}
        right_elb_fex_joint: {trajectory: 0.2, goal: 0.05}
        right_fam_rot_joint: {trajectory: 0.2, goal: 0.05}
        right_wrs_fex_joint: {trajectory: 0.2, goal: 0.05}
        right_thb_mip_joint: {trajectory: 0.3, goal: 0.08}
        right_ind_mip_joint: {trajectory: 0.3, goal: 0.08}
        right_mid_mip_joint: {trajectory: 0.3, goal: 0.08}
        right_rng_mip_joint: {trajectory: 0.3, goal: 0.08}
        right_pnk_mip_joint: {trajectory: 0.3, goal: 0.08}
